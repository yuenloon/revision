<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 80px 20px;
        }
        h1 { 
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 40px;
        }
        .btn-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 18px 35px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            min-width: 200px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: inline-block;
        }
        .btn:hover { 
            background-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        /* Button colors to tell them apart easily */
        .btn-mpu { background-color: #17a2b8; } /* Teal */
        .btn-mpu:hover { background-color: #117a8b; }
        
        .btn-fm { background-color: #6f42c1; }  /* Purple */
        .btn-fm:hover { background-color: #563d7c; }
        
        .btn-claude { background-color: #d9534f; } /* Coral/Red */
        .btn-claude:hover { background-color: #c9302c; }

        .btn-quiz { background-color: #28a745; } /* Green */
        .btn-quiz:hover { background-color: #218838; }

        .btn-dsfm { background-color: #fd7e14; } /* Orange */
        .btn-dsfm:hover { background-color: #dc6502; }

        .btn-claudefm { background-color: #e83e8c; } /* Pink/Magenta */
        .btn-claudefm:hover { background-color: #c82373; }
    </style>
</head>
<body>

    <h1>Welcome to My Project Hub</h1>
    <p>Select a project page below to explore:</p>

    <div class="btn-container">
        <!-- LINK TO MPU DEEPSEEK -->
        <a href="mpudeepseek.html" class="btn btn-mpu">MPU DeepSeek</a>

        <!-- LINK TO FM DEEPSEEK -->
        <a href="fmdeepseek.html" class="btn btn-fm">FM DeepSeek</a>

        <!-- LINK TO FM CLAUDE -->
        <a href="fmclaude.html" class="btn btn-claude">FM Claude</a>

        <!-- LINK TO MPU QUIZ -->
        <a href="mpuquiz.html" class="btn btn-quiz">MPU Quiz</a>

        <!-- LINK TO DS FM TEST -->
        <a href="dsfmtest.html" class="btn btn-dsfm">DS FM Test</a>

        <!-- LINK TO CLAUDE FM TEST -->
        <a href="claudefmtest.html" class="btn btn-claudefm">Claude FM Test</a>
    </div>

</body>
</html>
